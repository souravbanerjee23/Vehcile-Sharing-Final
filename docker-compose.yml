services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vehicle_sharing
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vehicle_sharing
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
